name: Paper bot

on:
  schedule:
    # Every 10 minutes, Monday to Friday, 07:00-21:59 UTC
    # (= 10:00-00:59 Turkey time, covers Borsa Istanbul and the US session)
    - cron: "*/10 7-21 * * 1-5"
  workflow_dispatch:   # lets you press "Run workflow" by hand

permissions:
  contents: write      # save the bot's records in the repository
  pages: write         # publish the results page
  id-token: write      # required by the Pages deploy step

concurrency:
  group: paper-bot     # never run two checks at the same time
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run one trading check
        run: python paper_bot.py --once --state-dir data

      - name: Build results page
        run: python report.py --state-dir data --out site/index.html

      - name: Save records
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update records"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish results page
        id: deploy
        uses: actions/deploy-pages@v4
